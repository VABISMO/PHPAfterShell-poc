# WP-specific lab tuning (see config/apache-tuning.conf for the bare
# targets). WordPress children are heavy (14-16MiB each), so the pinned
# pool is smaller: resting charge = pool anon + WP's ~20MiB code page
# cache. A small pool keeps the resting baseline low enough that the
# exploit's pressure - not WP's own footprint - decides where the cgroup
# limit is crossed (the landable band must sit BELOW bio-store transient
# and ABOVE the serialisation, with room for jitter).
<IfModule mpm_prefork_module>
    StartServers        3
    MinSpareServers     3
    MaxSpareServers     3
    MaxConnectionsPerChild 20
</IfModule>
