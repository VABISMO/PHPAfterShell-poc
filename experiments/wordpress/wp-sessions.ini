; Lab tuning for the WordPress target (no diagnostic endpoints - this is
; plain PHP session housekeeping, the kind of knob real hosts turn).
;
; The no-oracle chain never deletes session files itself, so without a
; short lifetime the nooom attempts would pile up multi-MiB session
; files forever (measured: 513 files / 314 MiB after one test round),
; whose page cache drifts the baseline the pressure feedback depends on.
session.gc_maxlifetime = 120
; and actually run the garbage collector often enough to keep up
; (PHP's default is 1% of requests)
session.gc_probability = 10
session.gc_divisor = 100
