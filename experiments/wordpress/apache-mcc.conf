# Production-plausible Apache tuning for a bounded container (capacity
# planning + Apache's own documented guidance - not exploit-specific):
#
# 1. MaxConnectionsPerChild - Apache's documented recommendation for
#    prefork ("recycled after N requests"): without it (default 0 =
#    unlimited) long-lived children accumulate allocator arenas from
#    every buffered request. Measured here: unreclaimable anon grew to
#    84 MiB of a 96 MiB limit at rest after a few attempts.
# 2. A pinned spare pool (start = min = max): the exploit holds ~10
#    concurrent connections; a FIXED pool means the same workers serve
#    every attempt, so their retained state - and with it the cgroup
#    baseline - stabilises instead of varying per attempt by more than
#    the width of the landable band (measured: +/-9 MiB with a dynamic
#    pool, which made the landing a lottery).
<IfModule mpm_prefork_module>
    StartServers        3
    MinSpareServers     3
    MaxSpareServers     3
    MaxConnectionsPerChild 1
</IfModule>
