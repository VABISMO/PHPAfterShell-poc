# ThinkPHP requires its public/.htaccess to be honoured (the
# front-controller rewrite for every non-file route). Stock Apache
# sets AllowOverride None for /var/www/, which 404s every route
# before ThinkPHP sees it; this restores what ThinkPHP's own Apache
# deployment documentation prescribes.
<Directory /var/www/html>
    AllowOverride All
</Directory>
