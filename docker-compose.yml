# phpAfterShell (CVE-2026-126714) - Controlled local lab
# All ports bound to 127.0.0.1 only. No external exposure.
#
# Fixed project name: container names (phpaftershell-victim-1, ...) must be
# identical on every machine - GitHub Actions checks out into a
# directory-named project, which would otherwise rename the containers.
name: phpaftershell

services:
  # Vulnerable default install: October-patched (PHP2Shell) but pre-phpAfterShell fix.
  victim:
    image: php:8.4.27-apache
    # Bounded memory (as production containers normally are): the OOM-based
    # interruption needs a cgroup boundary. restart policy: the exploit's
    # remote pressure may occasionally select the apache master; the
    # container must come back by itself for the next attempt.
    # The webroot must be writable so the injected gadget can drop the
    # webshell (real targets: use an uploads directory instead). /tmp is a
    # bind mount of ./sessions - on a fresh clone Docker creates that host
    # directory root:755, so make it world-writable-sticky before serving.
    #
    # Supervisor: the OOM may also select the apache master. Recovery must
    # be instant (not Docker's escalating restart backoff, which reaches
    # ~1min and starves the exploit of its attempt budget). The master is
    # tracked via its pidfile: while it is alive the loop sleeps inside
    # apache2-foreground; once it is gone, orphaned children are swept
    # (they cannot fork replacements and would pin :80 forever, forcing
    # every new connection into a backlog no one drains) and a fresh
    # master with a full worker pool takes over.
    command:
      - sh
      - -c
      - |
        chmod 777 /var/www/html
        chmod 1777 /tmp
        while true; do
          p=$$(cat /var/run/apache2/apache2.pid 2>/dev/null)
          if [ -n "$$p" ] && kill -0 "$$p" 2>/dev/null; then
            sleep 2
          else
            pkill -9 apache2 2>/dev/null
            sleep 0.3
            apache2-foreground || sleep 1
          fi
        done
    mem_limit: 64m
    restart: unless-stopped
    # gadget.php answers 200 without starting a session - the health
    # probe must not create a sess_* file every interval
    healthcheck:
      test: ["CMD-SHELL", php -r 'exit(@file_get_contents("http://127.0.0.1/gadget.php")===false?1:0);']
      interval: 2s
      timeout: 4s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:8087:80"
    volumes:
      - ./app:/var/www/html
      - ./sessions:/tmp
      - ./config/apache-tuning.conf:/etc/apache2/conf-enabled/zz-lab.conf:ro

  # Fixed control: contains the CVE-2026-126714 fix (released 2026-11-19).
  # Same memory boundary + writable webroot + supervisor as the victim so
  # the exploit's negative control exercises the real interruption path
  # against it (a fair control: the target must survive the pressure, the
  # fixed parser must simply never produce the evil object).
  fixed:
    image: php:8.4.28-apache
    command:
      - sh
      - -c
      - |
        chmod 777 /var/www/html
        while true; do
          p=$$(cat /var/run/apache2/apache2.pid 2>/dev/null)
          if [ -n "$$p" ] && kill -0 "$$p" 2>/dev/null; then
            sleep 2
          else
            pkill -9 apache2 2>/dev/null
            sleep 0.3
            apache2-foreground || sleep 1
          fi
        done
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", php -r 'exit(@file_get_contents("http://127.0.0.1/gadget.php")===false?1:0);']
      interval: 2s
      timeout: 4s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./app:/var/www/html
      - ./config/apache-tuning.conf:/etc/apache2/conf-enabled/zz-lab.conf:ro

  # Mitigation control: vulnerable version + official interim mitigation
  # (session.upload_progress.enabled = 0): the entry path disappears.
  mitigated:
    image: php:8.4.27-apache
    healthcheck:
      test: ["CMD-SHELL", php -r 'exit(@file_get_contents("http://127.0.0.1/gadget.php")===false?1:0);']
      interval: 2s
      timeout: 4s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./config/mitigation.ini:/usr/local/etc/php/conf.d/99-mitigation.ini:ro

  # Cross-SAPI target: nginx + php-fpm - the most common production
  # pairing. Same vulnerable PHP, same app, same memcg boundary; built
  # from fpm/ (see fastcgi_request_buffering off there). The exploit is
  # SAPI-agnostic: CI proves the chain against this target too.
  fpm:
    build: ./fpm
    command: sh -c "chmod 777 /var/www/html && chmod 1777 /tmp && exec /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf"
    # 64m (not 96m): the fpm target is lighter (nginx + fpm workers, no
    # per-child WP/apache footprint) and its band is proven at 64m -
    # locally (RCE attempt 4-6) and on CI (attempt 9).
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", php -r 'exit(@file_get_contents("http://127.0.0.1/gadget.php")===false?1:0);']
      interval: 2s
      timeout: 4s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./app:/var/www/html
      - ./sessions:/tmp

  # Laravel target: stock Laravel 11 on vulnerable PHP 8.4.27, app
  # baked at build time (no DB, no install-on-boot). The entry point
  # is a route middleware using native PHP sessions (a very common
  # package pattern); no diagnostics, no endpoints.
  laravel:
    # OPT-IN while WIP (serve-from-public/ + cookie middleware + gadget
    # still unverified): docker compose --profile laravel up -d --wait
    profiles: ["laravel"]
    build: ./laravel
    command: ["/usr/local/bin/lab-setup.sh"]
    # Laravel rests at ~47MiB of cgroup charge (vs ~22MiB for the bare
    # app), so the bare app's 64m leaves the victim no headroom: the
    # charge crosses during its page load instead of during the pwrite.
    # 112m is the measured band (at 96m the load peak crosses the limit
    # regardless of h; at 112m the crossing lands in the write window).
    # No swap headroom (memswap == mem): swap absorbs the OOM.
    mem_limit: 112m
    memswap_limit: 112m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/.lab-installed && php -r 'exit(@fsockopen(\"127.0.0.1\", 80)?0:1);'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "127.0.0.1:8092:80"

  # Drupal 7 target - OPT-IN via profile (never started by CI or a
  # plain 'docker compose up'):
  #   docker compose --profile drupal up -d --wait
  # Stock Drupal 7.98 on PHP 8.2.33 (inside the advisory's range),
  # installed at first boot by driving Drupal's own web installer
  # over HTTP. The chain plants PHPGGC's Drupal7/RCE1 (SchemaCache)
  # from Drupal core - see experiments/drupal/README.md.
  drupal:
    profiles: ["drupal"]
    build: ./drupal
    command: ["/usr/local/bin/lab-setup.sh"]
    # No swap headroom (memswap == mem): swap absorbs the OOM (the
    # same root cause measured on the WordPress target). The install
    # runs at BUILD time (it peaks at ~118 MiB, above any sane runtime
    # limit), so the runtime limit only bounds the exploit's own
    # pressure. 100m is the measured landable band of a FRESHLY
    # STARTED target (h in [13M, 23M]; first-run landing measured
    # 6/6 at attempts 1-3 - see experiments/drupal/README.md; the
    # target's page cache shifts the band once warmed, so restart the
    # target before a run).
    mem_limit: 100m
    memswap_limit: 100m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/.lab-installed && php -r 'exit(@fsockopen(\"127.0.0.1\", 80)?0:1);'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:8093:80"

  # WordPress target - OPT-IN via profile (never started by CI or a
  # plain 'docker compose up'):
  #   docker compose --profile wp up -d --wait
  # The chain against it is fully built (gadget from WordPress's own
  # core, entry via a realistic session-using mu-plugin) but the OOM
  # landing has not been reliable yet - see
  # experiments/wordpress/README.md for the measurements. Keeping it
  # behind a profile keeps the default lab and CI green while the
  # target stays runnable for research.
  wp:
    profiles: ["wp"]
    build: ./experiments/wordpress
    command: ["/usr/local/bin/lab-setup.sh"]
    depends_on:
      wp-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WP_URL: http://127.0.0.1:8091
    # Bounded memory with NO swap headroom (memswap == mem): without a
    # mem limit the victim never OOMs mid-pwrite; with swap available
    # memcg just swaps the charge out instead of killing the writer
    # (measured: memory.swap.current grew while the write completed).
    # 172m is where the 8-filler pressure band plus the victim's
    # serialise crosses exactly as its pwrite starts: the OOM then
    # interrupts the write inside the splice window (measured landable
    # h in ~[42M, 52M]; 180m was tried and pushed the band past the
    # fillers' range without sparing the consumer). Containers without
    # swap headroom (memory.swap.max=0) are also the default under
    # Kubernetes, where memory + memory-swap are set equal.
    mem_limit: 172m
    memswap_limit: 172m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/.lab-installed && php -r 'exit(@fsockopen(\"127.0.0.1\", 80)?0:1);'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      # Only the volume + opcache disabled: opcache is not loaded by
      # stock php.net installs (the Docker image turns it on), so this
      # RESTORES the default rather than tuning anything. With opcache
      # on, WP's cold source page-cache pool races the write charge and
      # the landing never comes (measured).
      - wp-data:/var/www/html
      - ./experiments/wordpress/apache-mcc.conf:/etc/apache2/conf-enabled/zz-lab-mcc.conf:ro
      - ./experiments/wordpress/opcache-off.ini:/usr/local/etc/php/conf.d/zz-opcache-off.ini:ro

  wp-db:
    profiles: ["wp"]
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  wp-data:
