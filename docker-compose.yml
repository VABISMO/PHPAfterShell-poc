# phpAfterShell (CVE-2026-126714) - Controlled local lab
# All ports bound to 127.0.0.1 only. No external exposure.
#
# Fixed project name: container names (phpaftershell-victim-1, ...) must be
# identical on every machine - GitHub Actions checks out into a
# directory-named project, which would otherwise rename the containers.
name: phpaftershell

services:
  # Vulnerable default install: October-patched (PHP2Shell) but pre-phpAfterShell fix.
  victim:
    build:
      context: .
      args:
        PHP_VERSION: "8.4.27"
    image: phpaftershell-victim:latest
    # Bounded memory (as production containers normally are): the OOM-based
    # interruption needs a cgroup boundary. restart policy: the exploit's
    # remote pressure may occasionally select the apache master; the
    # container must come back by itself for the next attempt.
    # The webroot must be writable so the injected gadget can drop the
    # webshell (real targets: use an uploads directory instead). /tmp is a
    # bind mount of ./sessions - on a fresh clone Docker creates that host
    # directory root:755, so make it world-writable-sticky before serving.
    #
    # Supervisor: the OOM may also select the apache master. Recovery must
    # be instant (not Docker's escalating restart backoff, which reaches
    # ~1min and starves the exploit of its attempt budget). The master is
    # tracked via its pidfile: while it is alive the loop sleeps inside
    # apache2-foreground; once it is gone, orphaned children are swept
    # (they cannot fork replacements and would pin :80 forever, forcing
    # every new connection into a backlog no one drains) and a fresh
    # master with a full worker pool takes over.
    command:
      - sh
      - -c
      - |
        chmod 777 /var/www/html
        chmod 1777 /tmp
        while true; do
          p=$$(cat /var/run/apache2/apache2.pid 2>/dev/null)
          if [ -n "$$p" ] && kill -0 "$$p" 2>/dev/null; then
            sleep 2
          else
            pkill -9 apache2 2>/dev/null
            sleep 0.3
            apache2-foreground || sleep 1
          fi
        done
    mem_limit: 64m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:80"
    volumes:
      - ./app:/var/www/html
      - ./sessions:/tmp
      - ./config/apache-tuning.conf:/etc/apache2/conf-enabled/zz-lab.conf:ro

  # Fixed control: contains the CVE-2026-126714 fix (released 2026-11-19).
  # Same memory boundary + writable webroot + supervisor as the victim so
  # the exploit's negative control exercises the real interruption path
  # against it (a fair control: the target must survive the pressure, the
  # fixed parser must simply never produce the evil object).
  fixed:
    build:
      context: .
      args:
        PHP_VERSION: "8.4.28"
    image: phpaftershell-fixed:latest
    command:
      - sh
      - -c
      - |
        chmod 777 /var/www/html
        while true; do
          p=$$(cat /var/run/apache2/apache2.pid 2>/dev/null)
          if [ -n "$$p" ] && kill -0 "$$p" 2>/dev/null; then
            sleep 2
          else
            pkill -9 apache2 2>/dev/null
            sleep 0.3
            apache2-foreground || sleep 1
          fi
        done
    mem_limit: 64m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./app:/var/www/html
      - ./config/apache-tuning.conf:/etc/apache2/conf-enabled/zz-lab.conf:ro

  # Mitigation control: vulnerable version + official interim mitigation
  # (session.upload_progress.enabled = 0): the entry path disappears.
  mitigated:
    image: php:8.4.27-apache
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./config/mitigation.ini:/usr/local/etc/php/conf.d/99-mitigation.ini:ro
