# nginx front-end for the phpAfterShell lab target.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.php;
    server_name _;

    # nginx's default is 1m - every request in this chain is bigger
    # (fillers 7MiB, the bio store and the victim's progress record
    # ~8MiB) and would be rejected with 413 before reaching PHP.
    client_max_body_size 32m;

    # THE critical setting (see fpm/Dockerfile): nginx's default
    # (fastcgi_request_buffering on) would spool the exploit's held
    # filler bodies to temp files on disk - reclaimable page cache -
    # instead of letting PHP's RFC1867 parser buffer them in the FPM
    # worker, and the pressure would evaporate. With off, the body
    # streams into the worker exactly like mod_php buffers it.
    fastcgi_request_buffering off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
}
