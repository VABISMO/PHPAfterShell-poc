; Complete replacement for the stock www.conf: one pool, sized like the
; apache target's pinned worker pool (idle 8, forks on demand to
; pm.max_children). The exploit holds ~10 concurrent connections
; (carrier + fillers + victim + oracle), so the idle floor must cover
; that or the chain starves on a queued connection.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.start_servers = 8
pm.min_spare_servers = 8
pm.max_spare_servers = 8
pm.max_children = 30

; workers recycle before allocator retention can drift the baseline
pm.max_requests = 20

; no request timeout short-circuits the victim (the exploit's victim
; connection lives a few seconds at most)
request_terminate_timeout = 0
