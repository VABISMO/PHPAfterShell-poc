# Production-plausible Apache tuning for a bounded container (capacity
# planning + Apache's own documented guidance - not exploit-specific).
# The same file the WordPress target ships, for the same measured
# reason: without it Laravel's baseline drifts - long-lived prefork
# children accumulate allocator arenas from every buffered multipart
# request (measured here: rest charge climbed from 40 MiB to 104 MiB of
# a 112 MiB limit after a few attempts, so the victim's page load was
# OOM-killed before its write on every attempt).
#
# 1. MaxConnectionsPerChild - Apache's documented recommendation for
#    prefork ("recycled after N requests"): without it (default 0 =
#    unlimited) long-lived children keep those arenas for the life of
#    the container.
# 2. A pinned spare pool (start = min = max): a FIXED pool means the
#    same workers serve every attempt, so their retained state - and
#    with it the cgroup baseline - stabilises instead of varying per
#    attempt by more than the width of the landable band.
<IfModule mpm_prefork_module>
    StartServers        3
    MinSpareServers     3
    MaxSpareServers     3
    MaxConnectionsPerChild 1
</IfModule>
