# Laravel requires its public/.htaccess to be honoured (the
# front-controller rewrite for every non-file route, plus the dotfile
# protections). Stock Apache sets AllowOverride None for /var/www/,
# which 404s every route before Laravel sees it; this restores what
# Laravel's own Apache deployment documentation prescribes.
<Directory /var/www/html>
    AllowOverride All
</Directory>
