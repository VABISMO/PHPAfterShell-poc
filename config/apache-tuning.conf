# Lab tuning for the phpAfterShell targets.
#
# 1. Freeze the worker pool at a constant size. The exploit's pressure
#    feedback needs a stable memory baseline: with the Debian defaults
#    the pool grows from 5 to ~15 children under the exploit's ~10
#    concurrent held connections, which moves the baseline by more than
#    the width of the landable OOM window - the feedback then chases a
#    target that shifts between attempts (nooom at one attempt, early at
#    the next with the same pressure). Min = Max keeps exactly this many
#    children warm; extras forked under load are reaped when idle.
# 2. Recycle workers after a bounded number of connections so anything a
#    request retained is returned to the OS when the child exits.
<IfModule mpm_prefork_module>
    StartServers        8
    MinSpareServers     8
    MaxSpareServers     8
    MaxConnectionsPerChild 20
</IfModule>
