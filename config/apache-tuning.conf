# Lab tuning for the phpAfterShell targets.
#
# Recycle workers after a bounded number of connections so the memory a
# request buffers (the exploit holds multi-MiB multipart bodies) is
# returned to the OS when the child exits, instead of accumulating in
# that child's allocator across attempts. The exploit's pressure
# feedback assumes a stable baseline between attempts; without this the
# baseline drifts upward and every attempt OOMs before the write.
<IfModule mpm_prefork_module>
    MaxConnectionsPerChild 20
</IfModule>
